name: Release macOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend deps
        run: npm install

      - name: Pre-sync version (避免 tauri 打包器不在 beforeBuildCommand 后重读 conf 导致的版本漂移)
        run: node scripts/sync-version.mjs

      - name: Build Tauri app (universal-apple-darwin)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 如需签名 + 公证，取消下面注释并在仓库 Secrets 配置：
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: '.'
          args: '--target universal-apple-darwin'
          tagName: '${{ github.ref_name }}'
          releaseName: '巨鹏软件客户端 ${{ github.ref_name }}'
          releaseBody: 'Automated macOS universal build.'
          releaseDraft: false
          prerelease: false
