<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>速览条</title>
  </head>
  <body>
    <!-- 悬停预览卡：默认隐藏，悬停条身向左展开（数据见 mini.ts renderCard） -->
    <div id="card" aria-hidden="true">
      <div class="c-sec">
        <div class="c-head">待办 <span class="c-badge" id="c-todo-n">0</span></div>
        <div class="c-rows" id="c-todos"></div>
      </div>
      <div class="c-sec">
        <div class="c-head">最新消息 <span class="c-badge" id="c-msg-n">0</span></div>
        <div class="c-rows" id="c-msgs"></div>
      </div>
      <div class="c-foot" id="c-panel" title="打开主面板">打开面板 →</div>
    </div>
    <!-- data-tauri-drag-region：按住空白区可拖动位置（按钮为子元素不触发拖拽，点击行为不变） -->
    <div id="mini" data-tauri-drag-region>
      <button class="m-btn" id="m-panel" title="打开面板">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.2" y="4.2" width="17.6" height="15.6" rx="2.4"/><path d="M9.6 4.5v15"/><path d="M6 8.5h.01M6 11.5h.01"/></svg>
      </button>
      <div class="m-sep"></div>
      <button class="m-btn" id="m-msg" title="未读消息：点击打开消息页">
        <span class="m-ico m-msg-ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v9a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 15.5z"/><path d="m4.5 7 7.5 5 7.5-5"/></svg></span>
        <span class="m-count" id="m-msg-n">0</span>
      </button>
      <div class="m-sep"></div>
      <button class="m-btn" id="m-todo" title="待办：点击打开待办页">
        <span class="m-ico m-todo-ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m4 5.5 1 1 2-2"/><path d="m4 11.5 1 1 2-2"/><path d="m4 17.5 1 1 2-2"/></svg></span>
        <span class="m-count" id="m-todo-n">0</span>
      </button>
      <div class="m-sep"></div>
      <button class="m-btn" id="m-quick" title="快捷功能：点击打开快捷功能页">
        <span class="m-ico m-quick-ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4.8 13.2h6L10.9 22l8.3-11.2h-6z"/></svg></span>
        <span class="m-count" id="m-quick-n">0</span>
      </button>
      <div class="m-sep"></div>
      <button class="m-btn m-close" id="m-close" title="关闭速览条（可在「我的」设置重新开启）">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-linecap="round"><circle cx="12" cy="12" r="9" stroke="#ffffff" stroke-width="2.2"/><path d="M9 9l6 6M15 9l-6 6" stroke="#e5484d" stroke-width="2.4"/></svg>
      </button>
    </div>
    <script type="module" src="/src/mini.ts"></script>
  </body>
</html>
