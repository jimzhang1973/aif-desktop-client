[package]
name = "aif-desktop-client"
version = "5.1.0"
description = "AIF 桌面消息提醒客户端 (Tauri)"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "aif_desktop_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "unstable"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "rt-multi-thread", "macros"] }
reqwest = { version = "0.12", features = ["json", "cookies"] }
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = "3"
dirs = "5"
anyhow = "1"
base64 = "0.22"
log = "0.4"
regex = "1"
# 勿扰时段判断需要本地时间（系统时区）
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tauri-plugin-log = "2"

# 伪最大化布局：读窗口所在显示器的工作区（排除任务栏）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi"] }
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
